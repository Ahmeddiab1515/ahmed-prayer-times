name: iOS build check

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install audio conversion tool
        run: brew install ffmpeg
      - name: Build iOS Simulator app
        run: xcodebuild -project ios/AwqatAlSalah.xcodeproj -scheme AwqatAlSalah -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
